[project]
name = "torchsense"
version = "0.1.0"
description = "A modular deep learning framework for intelligent sensing: radar point cloud, speech enhancement, and physiological signal detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "lightning>=2.1",
    "jsonargparse[signatures]>=4.27",
    "torchmetrics>=1.2",
    "scipy>=1.11",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "rich>=13.0",
    "h5py>=3.9",
    "pandas>=2.1",
]

[project.optional-dependencies]
export = [
    "onnx>=1.17",
    "onnxscript>=0.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "onnx>=1.17",
    "onnxscript>=0.1",
]

[project.scripts]
torchsense = "torchsense.cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchsense"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
